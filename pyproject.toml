[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "blackbox"
version = "1.0.0"
description = "BlackBox vNext with temporary legacy compatibility packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask-login>=0.6.3",
    "flask>=3.1.0",
    "flask-migrate>=4.1.0",
    "flask-session>=0.8.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "minimalmodbus>=2.1.1,<3",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.35.0",
    "websockets>=12.0",
    "pydantic>=2.12.5",
    "simpleeval>=1.0.3",
    "openpyxl>=3.1.5",
    "psutil>=7.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",
    "docker>=7.1.0",
    "pyarrow>=17.0.0",
    # Raspberry Pi 5 GPIO backends (Linux only):
    # - Prefer native libgpiod bindings.
    # - Fallback to RPi.GPIO-compatible API implemented via lgpio.
    "gpiod>=2.3.0; platform_system == 'Linux'",
    "rpi-lgpio>=0.6.0; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["blackbox", "modbus_acquire", "bb_platform", "platform", "services", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["blackbox", "modbus_acquire", "legacy"]
omit = ["*/tests/*"]
