{% extends "base.html" %}
{% block title %}Записи · BlackBox{% endblock %}
{% block body_class %}bb-wide{% endblock %}
{% block content %}
<section class="bb-card bb-explorer" id="bb-explorer">
  <div class="bb-page-toolbar">
    <div>
      <h1 class="bb-page-title">Записи</h1>
      <p class="bb-page-lead">Файлы с носителя. «Инциденты» — запись по аварии, «Движение» — запись по детектору, папка камеры — ручной эпизод.</p>
    </div>
  </div>
  <div class="bb-explorer-panel">
    <div class="bb-explorer-toolbar">
      <div class="bb-explorer-nav" aria-label="Навигация">
        <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm bb-icon-btn" id="bb-explorer-back" title="Назад" aria-label="Назад"><i class="bi bi-arrow-left"></i></button>
        <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm bb-icon-btn" id="bb-explorer-up" title="Вверх" aria-label="Вверх"><i class="bi bi-arrow-up"></i></button>
        <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm bb-icon-btn" id="bb-explorer-refresh" title="Обновить" aria-label="Обновить"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
      <nav id="bb-explorer-crumbs" class="bb-explorer-crumbs" aria-label="Адрес"></nav>
      <button type="button" class="bb-btn bb-btn-sm" id="bb-explorer-download" disabled><i class="bi bi-download"></i> Скачать</button>
    </div>
    <div class="bb-explorer-body">
      <aside class="bb-explorer-side" aria-label="Папки">
        <p class="bb-explorer-side-title">Папки</p>
        <div id="bb-explorer-tree" class="bb-explorer-tree"></div>
      </aside>
      <div class="bb-table-wrap bb-explorer-list-wrap">
        <table class="bb-table bb-explorer-table">
          <thead>
            <tr>
              <th><button type="button" data-sort="name">Имя</button></th>
              <th><button type="button" data-sort="modified">Изменён</button></th>
              <th><button type="button" data-sort="type">Тип</button></th>
              <th><button type="button" data-sort="size">Размер</button></th>
            </tr>
          </thead>
          <tbody id="bb-explorer-rows"></tbody>
        </table>
      </div>
    </div>
    <div id="bb-explorer-status" class="bb-explorer-status"></div>
  </div>
</section>
<script defer src="/static/recordings.js?v={{ app_version }}"></script>
{% endblock %}
