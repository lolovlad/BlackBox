{% extends "base.html" %}
{% block title %}Графики · BlackBox{% endblock %}
{% block body_class %}bb-wide{% endblock %}
{% block content %}
<section class="bb-card" id="bb-charts" data-bb-events data-series-url="/api/v1/telemetry/series">
  <h1 class="bb-page-title">Графики</h1>
  <form id="bb-chart-form" onsubmit="return false;">
    <div class="bb-tabs bb-vm-tabs" role="tablist" aria-label="Машины">
      {% for vm in vms %}
      <label class="bb-tab"><input type="radio" name="vm_id" value="{{ vm.id }}" {% if loop.first %}checked{% endif %}> {{ vm.name }}</label>
      {% else %}
      <p class="bb-hint">Виртуальных машин пока нет.</p>
      {% endfor %}
    </div>
    <div class="bb-filter-grid">
      <label class="bb-filter-field">Дата с
        <input type="datetime-local" name="date_from" autocomplete="off">
      </label>
      <label class="bb-filter-field">Дата по
        <input type="datetime-local" name="date_to" autocomplete="off" title="Полночь 00:00 включает весь этот день">
      </label>
    </div>
    <div class="bb-tabs" role="tablist" aria-label="Вид графика">
      <label class="bb-tab"><input type="radio" name="active_tab" value="analog" checked> Аналоги</label>
      <label class="bb-tab"><input type="radio" name="active_tab" value="discrete"> Дискреты</label>
    </div>
    <div class="bb-row-actions">
      <div id="bb-chart-fields"></div>
      <button type="button" class="bb-btn" id="bb-chart-refresh">Обновить график</button>
    </div>
  </form>
  <div id="bb-chart-view">
    <p class="bb-hint" id="bb-chart-meta">Загрузка графика…</p>
    <div id="bb-echarts" class="bb-echarts"></div>
  </div>
</section>
<script defer src="/static/vendor/echarts.min.js?v={{ app_version }}"></script>
<script defer src="/static/charts.js?v={{ app_version }}"></script>
{% endblock %}
