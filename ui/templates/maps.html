{% extends "base.html" %}
{% block title %}Карты · BlackBox{% endblock %}
{% block content %}
<script type="application/json" id="bb-maps-payload">{{ maps | tojson }}</script>
<section class="bb-maps-page" x-data="bbMapsPage()" x-init="hydrate()" @keydown.escape.window="onEscape()">
  <div class="bb-maps-hero">
    <div>
      <h1 class="bb-page-title">Карты чтения</h1>
    </div>
    <div class="bb-maps-hero-actions">
      <button type="button" class="bb-btn" @click="openUpload(false)"><i class="bi bi-upload"></i> Загрузить</button>
    </div>
  </div>

  <div class="bb-maps-toolbar">
    <label class="bb-maps-search">
      <i class="bi bi-search"></i>
      <input type="search" x-model="query" placeholder="Поиск">
    </label>
    <div class="bb-maps-filters" role="tablist">
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'all' }" @click="filter = 'all'">Все</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'simulator' }" @click="filter = 'simulator'">Simulator</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'modbus_rtu' }" @click="filter = 'modbus_rtu'">Modbus RTU</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'modbus_tcp' }" @click="filter = 'modbus_tcp'">Modbus TCP</button>
    </div>
  </div>

  <template x-for="family in families" :key="family.key">
    <section class="bb-map-family">
      <header class="bb-map-family-head">
        <h2 x-text="protocolLabel(family.protocol)"></h2>
        <span x-show="family.preset_id" x-text="family.preset_id"></span>
        <span class="bb-map-count" x-text="family.items.length + (family.items.length === 1 ? ' версия' : ' версий')"></span>
      </header>
      <div class="bb-map-grid">
        <template x-for="(map, index) in family.items" :key="map.version + '::' + map.protocol">
          <button type="button" class="bb-map-card" @click="openMap(map)">
            <div class="bb-map-card-top">
              <strong x-text="map.version"></strong>
              <span class="bb-map-pill" x-show="index === 0">актуальная</span>
            </div>
            <p class="bb-map-card-meta">
              <span x-text="protocolLabel(map.protocol)"></span>
              <span x-text="formatStamp(map.created_at)"></span>
            </p>
            <code class="bb-map-checksum" x-text="shortChecksum(map.checksum)"></code>
          </button>
        </template>
      </div>
    </section>
  </template>
  <p class="bb-muted" x-show="families.length === 0">Нет карт.</p>

  <div class="bb-studio" x-show="studioOpen" x-cloak>
    <div class="bb-studio-backdrop" @click="closeStudio()"></div>
    <div class="bb-studio-panel" role="dialog" aria-modal="true" aria-labelledby="bb-studio-title" @click.stop>
      <header class="bb-studio-head">
        <div>
          <h2 id="bb-studio-title" x-text="draft ? (publishVersion || 'Новая карта') : (currentMap ? currentMap.version : 'Карта')"></h2>
          <p class="bb-studio-sub">
            <span x-text="protocolLabel(draftProtocol)"></span>
            <span x-show="draftPreset" x-text="draftPreset"></span>
            <span x-show="draft" class="bb-map-pill bb-map-pill-warn">черновик</span>
          </p>
        </div>
        <div class="bb-studio-head-actions">
          <button type="button" class="bb-btn" x-show="!draft" @click="openUpload(true)"><i class="bi bi-plus-lg"></i> Новая версия</button>
          <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm" @click="copyJson()" :disabled="!documentText"><i class="bi bi-clipboard"></i> Копировать</button>
          <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm" @click="downloadJson()" :disabled="!documentText"><i class="bi bi-download"></i> Скачать</button>
          <button type="button" class="bb-btn bb-btn-ghost bb-btn-sm" @click="closeStudio()" aria-label="Закрыть"><i class="bi bi-x-lg"></i></button>
        </div>
      </header>

      <div class="bb-studio-meta">
        <label>Название
          <input x-model="publishVersion" :readonly="!draft" required>
        </label>
        <label>Тип
          <select x-model="draftProtocol" :disabled="!draft">
            <option value="simulator">Simulator</option>
            <option value="modbus_rtu">Modbus RTU</option>
            <option value="modbus_tcp">Modbus TCP</option>
          </select>
        </label>
        <label>Preset
          <input x-model="draftPreset" :readonly="!draft">
        </label>
        <button type="button" class="bb-btn" x-show="draft" @click="publishFromEditor()" :disabled="saving || !documentText">
          <span x-show="!saving">Опубликовать версию</span>
          <span x-show="saving">Публикация…</span>
        </button>
      </div>

      <div class="bb-studio-body">
        <aside class="bb-studio-versions">
          <h3>Версии</h3>
          <ol>
            <template x-for="(map, index) in familyVersions" :key="map.version + '::' + map.protocol">
              <li>
                <button type="button" class="bb-version-item" :class="{ 'is-active': isSelected(map) && !draft }" @click="openMap(map)">
                  <span class="bb-version-dot" :class="{ 'is-latest': index === 0 }"></span>
                  <span>
                    <strong x-text="map.version"></strong>
                    <small x-text="formatStamp(map.created_at)"></small>
                  </span>
                </button>
              </li>
            </template>
          </ol>
        </aside>
        <div class="bb-studio-editor">
          <p class="bb-muted" x-show="loading">Загрузка…</p>
          <label class="bb-studio-json-label">Карта
            <textarea class="bb-json-editor" spellcheck="false" x-model="documentText" :readonly="loading || !draft"></textarea>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="bb-studio bb-publish-modal" x-show="publishOpen" x-cloak>
    <div class="bb-studio-backdrop" @click="publishOpen = false"></div>
    <div class="bb-publish-panel" role="dialog" aria-modal="true" aria-labelledby="bb-publish-title" @click.stop>
      <header class="bb-studio-head">
        <div>
          <h2 id="bb-publish-title" x-text="uploadAsNewVersion ? 'Новая версия' : 'Загрузить карту'"></h2>
        </div>
        <button type="button" class="bb-btn bb-btn-ghost bb-btn-sm" @click="publishOpen = false" aria-label="Закрыть"><i class="bi bi-x-lg"></i></button>
      </header>
      <div class="bb-form bb-publish-form">
        <label>Файл
          <input type="file" accept="application/json,.json" @change="onFileChosen($event)">
        </label>
        <div class="bb-actions">
          <button type="button" class="bb-btn bb-btn-secondary" @click="publishOpen = false">Отмена</button>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
