{% extends "base.html" %}
{% block title %}Карты · BlackBox{% endblock %}
{% block content %}
<script type="application/json" id="bb-maps-payload">{{ maps | tojson }}</script>
<section class="bb-maps-page" x-data="bbMapsPage()" x-init="hydrate()" @keydown.escape.window="onEscape()">
  <input class="bb-sr-only" type="file" accept="application/json,.json" x-ref="mapFile" @change="onFileChosen($event)">
  <div class="bb-maps-hero">
    <div>
      <h1 class="bb-page-title">Карты чтения</h1>
    </div>
    <div class="bb-maps-hero-actions">
      <a class="bb-btn bb-btn-secondary" href="/static/docs/sozdanie-kart.md" download="sozdanie-kart.md"><i class="bi bi-journal-text"></i> Инструкция</a>
      <button type="button" class="bb-btn" @click="pickFile()" :disabled="saving"><i class="bi bi-upload"></i> Загрузить</button>
    </div>
  </div>

  <div class="bb-maps-toolbar">
    <label class="bb-maps-search">
      <i class="bi bi-search"></i>
      <input type="search" x-model="query" placeholder="Поиск">
    </label>
    <div class="bb-maps-filters" role="tablist">
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'all' }" @click="filter = 'all'">Все</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'simulator' }" @click="filter = 'simulator'">Simulator</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'modbus_rtu' }" @click="filter = 'modbus_rtu'">Modbus RTU</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'modbus_tcp' }" @click="filter = 'modbus_tcp'">Modbus TCP</button>
      <button type="button" class="bb-chip" :class="{ 'is-active': filter === 'can' }" @click="filter = 'can'">CAN</button>
    </div>
  </div>

  <div class="bb-map-grid">
    <template x-for="family in families" :key="family.key">
      <article class="bb-map-card" @click="openMap(family.items[0])">
        <div class="bb-map-card-top">
          <strong x-text="family.name"></strong>
          <span class="bb-map-pills">
            <span class="bb-map-pill" x-text="'v' + (family.items[0].revision || 1)"></span>
            <span class="bb-map-pill">актуальная</span>
          </span>
        </div>
        <p class="bb-map-card-meta">
          <span x-text="protocolLabel(family.protocol)"></span>
          <span x-text="formatStamp(family.items[0].created_at)"></span>
        </p>
        <p class="bb-map-card-meta">
          <span x-text="family.items.length + (family.items.length === 1 ? ' версия' : ' версий')"></span>
          <code class="bb-map-checksum" x-text="shortChecksum(family.items[0].checksum)"></code>
        </p>
        <div class="bb-map-card-actions">
          <button type="button" class="bb-btn bb-btn-sm" @click.stop="pickFile(family.items[0])" :disabled="saving">Новая версия</button>
        </div>
      </article>
    </template>
  </div>
  <p class="bb-muted" x-show="families.length === 0">Нет карт.</p>

  <div class="bb-studio" x-show="studioOpen" x-cloak>
    <div class="bb-studio-backdrop" @click="closeStudio()"></div>
    <div class="bb-studio-panel" role="dialog" aria-modal="true" aria-labelledby="bb-studio-title" @click.stop>
      <header class="bb-studio-head">
        <div>
          <h2 id="bb-studio-title" x-text="currentMap ? ((currentMap.name || currentMap.version) + ' · v' + (currentMap.revision || 1)) : 'Карта'"></h2>
          <p class="bb-studio-sub">
            <span x-text="protocolLabel(draftProtocol)"></span>
            <span x-show="draftPreset" x-text="draftPreset"></span>
          </p>
        </div>
        <div class="bb-studio-head-actions">
          <button type="button" class="bb-btn" x-show="currentMap" @click="pickFile(currentMap)" :disabled="saving"><i class="bi bi-upload"></i> Новая версия</button>
          <button type="button" class="bb-btn bb-btn-danger bb-btn-sm" x-show="currentMap" @click="deleteMap(currentMap)"><i class="bi bi-trash"></i> Удалить</button>
          <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm" @click="copyJson()" :disabled="!documentText"><i class="bi bi-clipboard"></i> Копировать</button>
          <button type="button" class="bb-btn bb-btn-secondary bb-btn-sm" @click="downloadJson()" :disabled="!documentText"><i class="bi bi-download"></i> Скачать</button>
          <button type="button" class="bb-btn bb-btn-ghost bb-btn-sm" @click="closeStudio()" aria-label="Закрыть"><i class="bi bi-x-lg"></i></button>
        </div>
      </header>

      <div class="bb-studio-body">
        <aside class="bb-studio-versions">
          <h3>Версии</h3>
          <ol>
            <template x-for="(map, index) in familyVersions" :key="map.version + '::' + map.protocol">
              <li class="bb-version-row">
                <button type="button" class="bb-version-item" :class="{ 'is-active': isSelected(map) }" @click="openMap(map)">
                  <span class="bb-version-dot" :class="{ 'is-latest': index === 0 }"></span>
                  <span>
                    <strong x-text="'v' + (map.revision || 1)"></strong>
                    <small x-text="formatStamp(map.created_at)"></small>
                  </span>
                </button>
                <button type="button" class="bb-btn bb-btn-ghost bb-btn-sm bb-btn-danger" @click.stop="deleteMap(map)" :aria-label="'Удалить ' + map.version"><i class="bi bi-trash"></i></button>
              </li>
            </template>
          </ol>
        </aside>
        <div class="bb-studio-editor">
          <p class="bb-muted" x-show="loading">Загрузка…</p>
          <label class="bb-studio-json-label">Карта
            <textarea class="bb-json-editor" spellcheck="false" x-model="documentText" readonly></textarea>
          </label>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
