<table><tr><th>Имя</th><th>Протокол</th><th>Карта</th><th>Состояние</th>{% if user.role == 'admin' %}<th>Операции</th>{% endif %}</tr>{% for vm in vms %}<tr><td><a href="/vms/{{ vm.id }}">{{ vm.name }}</a></td><td>{{ vm.protocol }}</td><td>{{ vm.map_version }}</td><td>{{ vm.lifecycle }}</td>{% if user.role == 'admin' %}<td><button data-vm-action="start" data-vm-id="{{ vm.id }}">Start</button> <button data-vm-action="stop" data-vm-id="{{ vm.id }}">Stop</button> <button data-vm-action="restart" data-vm-id="{{ vm.id }}">Restart</button> <button data-vm-action="apply-map" data-vm-id="{{ vm.id }}">Apply map</button> <a href="/admin/vms/{{ vm.id }}/edit">Изменить</a></td>{% endif %}</tr>{% else %}<tr><td colspan="5">VM пока нет.</td></tr>{% endfor %}</table>
