<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}BlackBox Hub{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/tailwind.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/app.js?v={{ app_version }}"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body class="bb-body {% block body_class %}{% endblock %}" x-data="bbShell()" @bb-toast.window="pushToast($event.detail)">
  {% if user %}
  <header class="bb-header">
    <div class="bb-header-inner">
      <a href="/dashboard" class="bb-brand">
        <span class="bb-brand-mark">B</span>
        <span class="bb-brand-copy">
          <span class="bb-brand-text">BlackBox</span>
          <span class="bb-brand-meta">{{ app_vendor }} · v{{ app_version }}</span>
        </span>
      </a>
      <nav class="bb-nav" aria-label="Основное меню">
        {% set path = request.url.path %}
        <a href="/dashboard" class="bb-nav-link{% if path == '/dashboard' %} is-active{% endif %}"><i class="bi bi-speedometer2"></i> Дашборд</a>
        <a href="/vms" class="bb-nav-link{% if path.startswith('/vms') or path.startswith('/admin/vms') %} is-active{% endif %}"><i class="bi bi-hdd-stack"></i> ВМ</a>
        {% if user.role == 'admin' %}
        <a href="/admin/maps" class="bb-nav-link{% if path.startswith('/admin/maps') %} is-active{% endif %}"><i class="bi bi-file-earmark-code"></i> Карты</a>
        <a href="/admin/resources" class="bb-nav-link{% if path.startswith('/admin/resources') %} is-active{% endif %}"><i class="bi bi-hdd-network"></i> Ресурсы</a>
        {% endif %}
      </nav>
      <div class="bb-header-meta">
        <span class="bb-user">{{ user.username }} <span class="bb-role">{{ user.role }}</span></span>
        <button type="button" class="bb-btn bb-btn-ghost" data-logout><i class="bi bi-box-arrow-right"></i> Выйти</button>
      </div>
    </div>
  </header>
  {% endif %}

  <div class="bb-toast-host" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div class="bb-toast" :class="'bb-toast-' + t.kind" x-text="t.message"></div>
    </template>
  </div>

  <main class="bb-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
