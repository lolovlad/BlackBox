{% extends "base.html" %}
{% block content %}<section class="card"><h1>Админ · виртуальные машины</h1><p><a href="/admin/resources">Сканировать и подтвердить ресурсы</a></p>{% include "vm_table.html" %}<h2>Создать VM</h2><form id="create-vm" method="post"><label>Имя<input name="name" required></label><label>Протокол<select name="protocol"><option value="simulator">Simulator</option><option value="modbus_rtu">Modbus RTU</option></select></label><label>Preset ID<input name="preset_id" placeholder="optional"></label><label>Версия карты<input name="map_version" value="default-v1"></label><button type="submit">Создать</button></form><h2>Загрузить JSON-карту</h2><form id="map-upload" enctype="multipart/form-data"><label>Протокол<select name="protocol"><option value="simulator">Simulator</option><option value="modbus_rtu">Modbus RTU</option></select></label><label>Версия<input name="version" required></label><label>Preset<input name="preset_id"></label><label>JSON-файл<input type="file" name="file" accept="application/json" required></label><button type="submit">Опубликовать immutable map</button></form></section>{% endblock %}
